<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulador BC — Casamento</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f8f6f3;--card:#ffffff;--border:#e5ddd6;--border2:#ccc0b5;
  --text:#1a1108;--text2:#6b5c50;--text3:#9c8c82;
  --green:#1e7e34;--green-bg:#eafbee;--red:#b91c1c;--red-bg:#fef2f2;
  --warn:#92400e;--warn-bg:#fffbeb;
  --primary:#b5622a;--primary-bg:#fdf0e8;
  --radius:10px;--radius-sm:7px;
}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:13px;min-height:100vh}
.app{max-width:1200px;margin:0 auto}
.hdr{background:#fff;border-bottom:1px solid var(--border);padding:1rem 1.5rem;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.hdr-t{font-size:16px;font-weight:600;color:var(--text)}
.hdr-s{font-size:11px;color:var(--text2);margin-top:2px}
.sp{font-size:11px;padding:3px 12px;border-radius:20px;border:1px solid transparent;min-width:70px;text-align:center;transition:all .3s;font-weight:500}
.sp.saving{color:#92400e;border-color:#fcd34d;background:#fffbeb}
.sp.saved{color:#1e7e34;border-color:#6ee7b7;background:#eafbee}
.sp.err{color:#b91c1c;border-color:#fca5a5;background:#fef2f2}
.tbar{background:#fff;border-bottom:1px solid var(--border);display:flex;padding:0 1.5rem;overflow-x:auto}
.tb{padding:.7rem 1.1rem;font-size:13px;font-weight:400;color:var(--text2);background:transparent;border:none;border-bottom:2.5px solid transparent;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap;transition:color .15s}
.tb:hover,.tb.active{color:var(--text)}
.tb.active{font-weight:600;border-bottom-color:var(--primary)}
.pane{display:none;padding:1.5rem}
.pane.on{display:block}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1.2rem;margin-bottom:1rem}
.ct{font-size:14px;font-weight:600;color:var(--text);margin-bottom:1rem;display:flex;align-items:center;gap:7px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem}
.fl{font-size:11px;color:var(--text2);margin-bottom:3px;display:block;font-weight:500;text-transform:uppercase;letter-spacing:.03em}
.fi{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);background:#fff;color:var(--text);font-family:inherit;font-size:13px;transition:border .15s}
.fi:focus{outline:none;border-color:var(--primary)}
.mb{margin-bottom:.8rem}
.rl{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--border);font-size:13px}
.rl:last-child{border-bottom:none}
.rl .la{color:var(--text2)}
.rl .va{font-weight:500}
.rl .va.ng{color:var(--red);font-weight:400}
.rl .va.ps{color:var(--green)}
.rl .va.hi{font-size:15px;font-weight:600}
.rtot{border-top:1.5px solid var(--border2)!important;margin-top:6px!important;padding-top:8px!important;border-bottom:none!important}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.04em;padding:8px 9px;text-align:left;background:#faf8f6;border-bottom:1px solid var(--border)}
td{padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fdfbf9}
.tc{width:100%;padding:5px 7px;border:1px solid var(--border);border-radius:var(--radius-sm);background:#fff;color:var(--text);font-family:inherit;font-size:12.5px;transition:border .15s}
.tc:focus{outline:none;border-color:var(--primary)}
.mc{background:#faf8f6;border:1px solid var(--border);border-radius:var(--radius);padding:.9rem;text-align:center}
.mc .ml{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.03em;font-weight:500}
.mc .mv{font-size:20px;font-weight:600;margin-top:4px}
.mc .mv.ps{color:var(--green)}
.mc .mv.ng{color:var(--red)}
.mc .mv.wn{color:var(--warn)}
.badb{font-size:12px;padding:3px 8px;color:var(--red);border:1px solid #fca5a5;background:transparent;border-radius:var(--radius-sm);cursor:pointer}
.badb:hover{background:var(--red-bg)}
.addb{width:100%;margin-top:.75rem;font-size:13px;padding:8px;color:var(--text2);border:1.5px dashed var(--border2);border-radius:var(--radius);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;font-family:inherit}
.addb:hover{background:var(--primary-bg);border-color:var(--primary);color:var(--primary)}
.posv{color:var(--green)!important;font-weight:600}
.negv{color:var(--red)!important;font-weight:600}
.empty-state{text-align:center;padding:3rem;color:var(--text2);border:1.5px dashed var(--border2);border-radius:var(--radius)}
.note{font-size:11px;color:var(--text3);margin-top:.7rem}
#loading-overlay{position:fixed;inset:0;background:rgba(248,246,243,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;gap:12px}
#loading-overlay p{font-size:14px;color:var(--text2)}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:700px){.g2,.g3{grid-template-columns:1fr}.pane{padding:1rem}.hdr{padding:.8rem 1rem}.tbar{padding:0 .5rem}}
</style>
</head>
<body>

<div id="loading-overlay">
  <div class="spinner"></div>
  <p>Carregando dados compartilhados...</p>
</div>

<div class="app">
  <div class="hdr">
    <div>
      <div class="hdr-t">💍 Simulador Business Case — Casamento</div>
      <div class="hdr-s">Planejamento financeiro compartilhado · dados sincronizados na nuvem</div>
    </div>
    <span id="sp" class="sp"></span>
  </div>
  <div class="tbar">
    <button class="tb active" data-t="receitas" onclick="goTab('receitas')">💰 Receitas</button>
    <button class="tb" data-t="custos"    onclick="goTab('custos')">📋 Custos Mensais</button>
    <button class="tb" data-t="casamento" onclick="goTab('casamento')">💒 Casamento</button>
    <button class="tb" data-t="bc"        onclick="goTab('bc')">📈 Business Case</button>
  </div>
  <div id="pane-receitas"  class="pane on" data-t="receitas"></div>
  <div id="pane-custos"    class="pane"    data-t="custos"></div>
  <div id="pane-casamento" class="pane"    data-t="casamento"></div>
  <div id="pane-bc"        class="pane"    data-t="bc"></div>
</div>

<script>
/* ============================================================
   CONFIGURAÇÃO SUPABASE
   ============================================================ */
const SB_URL = 'https://qyxvnjlosiblcmnubqyp.supabase.co';
const SB_KEY = 'sb_publishable_LRsXfh8V1O7PLW2RbdrYZw_t6u1r1wf';
const SB_HEADERS = {
  'Content-Type': 'application/json',
  'apikey': SB_KEY,
  'Authorization': 'Bearer ' + SB_KEY
};

/* ============================================================
   UTILS
   ============================================================ */
const $  = id => document.getElementById(id);
const M  = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const uid  = () => Math.random().toString(36).substr(2,9);
const esc  = s  => String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const fmt  = v  => 'R$\u00a0'+(+v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtS = v  => (v>=0?'+':'')+fmt(v);
const fmtM = s  => { const [y,m]=s.split('-').map(Number); return M[m-1]+'/'+y; };
const mToD = s  => { if(!s)return null; const [y,m]=s.split('-').map(Number); return new Date(y,m-1,1); };
const addM = (d,n) => { const r=new Date(d); r.setMonth(r.getMonth()+n); return r; };
const dToM = d  => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
const mDiff= (a,b) => { const da=mToD(a),db=mToD(b); if(!da||!db)return -1; return (db.getFullYear()-da.getFullYear())*12+(db.getMonth()-da.getMonth()); };

/* ============================================================
   ESTADO
   ============================================================ */
let curTab = 'receitas';
let saveT  = null;
let S = {
  pessoas: {
    noivo: {nome:'',salario:0,carro:0,espp:0},
    noiva: {nome:'',salario:0,carro:0,espp:0}
  },
  custos: [], casamento: [], bc: {data:'',inicio:''}
};

/* ============================================================
   IMPOSTOS (INSS + IRPF — tabelas 2024/2025)
   ============================================================ */
function calcINSS(g){
  if(!g)return 0;
  const f=[{l:1412,r:.075},{l:2666.68,r:.09},{l:4000.03,r:.12},{l:7786.02,r:.14}];
  let ins=0,p=0;
  for(const x of f){ if(g<=p)break; ins+=(Math.min(g,x.l)-p)*x.r; p=x.l; if(g<=x.l)break; }
  return Math.min(ins,908.86);
}
function calcIRPF(base){
  if(base<=2259.20)return 0;
  const f=[{l:2826.65,r:.075,d:169.44},{l:3751.05,r:.15,d:381.44},{l:4664.68,r:.225,d:662.77},{l:Infinity,r:.275,d:896}];
  for(const x of f) if(base<=x.l) return Math.max(0,base*x.r-x.d);
  return 0;
}
function netP(p){
  const g=p.salario||0, ins=calcINSS(g), irpf=calcIRPF(g-ins),
        espp=g*(p.espp||0)/100, car=p.carro||0;
  return {g,ins,irpf,espp,car,n:g-ins-irpf-espp-car};
}

/* ============================================================
   SUPABASE — SAVE / LOAD
   ============================================================ */
async function save(){
  setSP('saving');
  try{
    const res = await fetch(SB_URL+'/rest/v1/wedding_data', {
      method : 'POST',
      headers: {...SB_HEADERS, 'Prefer':'resolution=merge-duplicates'},
      body   : JSON.stringify({id:'main', data:S, updated_at:new Date().toISOString()})
    });
    if(res.ok) setSP('saved');
    else{ console.error('Supabase save error',res.status,await res.text()); setSP('err'); }
  }catch(e){ console.error(e); setSP('err'); }
}

async function load(){
  try{
    const res = await fetch(SB_URL+'/rest/v1/wedding_data?id=eq.main&select=data', {headers:SB_HEADERS});
    const rows = await res.json();
    if(rows && rows.length>0 && rows[0].data){
      const d = rows[0].data;
      S = {...S,...d};
      if(!S.pessoas)  S.pessoas  = {noivo:{nome:'',salario:0,carro:0,espp:0},noiva:{nome:'',salario:0,carro:0,espp:0}};
      if(!S.custos)   S.custos   = [];
      if(!S.casamento)S.casamento= [];
      if(!S.bc)       S.bc       = {data:'',inicio:''};
    }
  }catch(e){ console.error('Load error',e); }
  if(!S.casamento.length) initDef();
  $('loading-overlay').style.display='none';
  renderAll();
}

function qs(){ clearTimeout(saveT); saveT=setTimeout(save,700); }

function setSP(s){
  const el=$('sp'); if(!el)return;
  if(s==='saving'){ el.textContent='Salvando...'; el.className='sp saving'; }
  else if(s==='saved'){ el.textContent='Salvo ✓'; el.className='sp saved'; setTimeout(()=>{el.textContent='';el.className='sp';},2500); }
  else if(s==='err'){ el.textContent='Erro ✕'; el.className='sp err'; }
  else{ el.textContent=''; el.className='sp'; }
}

/* ============================================================
   DADOS PADRÃO CASAMENTO
   ============================================================ */
function initDef(){
  const it=['Buffet','Cerimonialista','Vestido Noiva','Terno Noivo',
            'Foto e Vídeo','Aluguel Carro','Aliança','Maquiagem e Cabelo Noiva'];
  S.casamento=it.map(d=>({id:uid(),desc:d,resp:'ambos',pn:50,pa:50,parc:1,tipo:'fixo',vf:0,vv:[0],inicio:''}));
}

/* ============================================================
   TABS
   ============================================================ */
window.goTab=function(t){
  curTab=t;
  document.querySelectorAll('.tb').forEach(b=>b.classList.toggle('active',b.dataset.t===t));
  document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('on',p.dataset.t===t));
  if(t==='bc') rBC();
};

function renderAll(){ rReceitas(); rCustos(); rCasamento(); }

/* ============================================================
   ABA RECEITAS
   ============================================================ */
function rReceitas(){
  const pane=$('pane-receitas'); if(!pane)return;
  const pcol=pid=>{
    const lbl=pid==='noivo'?'Noivo':'Noiva', p=S.pessoas[pid];
    return `<div class="card">
      <div class="ct">${pid==='noivo'?'🤵':'👰'} <span id="ttl-${pid}">${esc(p.nome)||lbl}</span></div>
      <div class="mb"><label class="fl">Nome</label>
        <input class="fi" type="text" value="${esc(p.nome)}" placeholder="${lbl}"
          oninput="upP('${pid}','nome',this.value)"></div>
      <div class="mb"><label class="fl">Salário Bruto (R$)</label>
        <input class="fi" type="number" value="${p.salario||''}" placeholder="0" min="0"
          oninput="upP('${pid}','salario',+this.value||0);rRec()"></div>
      <div class="mb"><label class="fl">Dedução Carro (R$/mês)</label>
        <input class="fi" type="number" value="${p.carro||''}" placeholder="0" min="0"
          oninput="upP('${pid}','carro',+this.value||0);rRec()"></div>
      <div class="mb"><label class="fl">ESPP (% do salário bruto)</label>
        <input class="fi" type="number" value="${p.espp||''}" placeholder="0" min="0" max="100"
          oninput="upP('${pid}','espp',+this.value||0);rRec()"></div>
      <div id="calc-${pid}"></div>
    </div>`;
  };
  pane.innerHTML=`<div class="g2">${pcol('noivo')}${pcol('noiva')}</div>
    <div class="card"><div class="ct">👫 Resumo do Casal</div><div id="casal-res"></div></div>`;
  updCalc('noivo'); updCalc('noiva'); updCasal();
}

function updCalc(pid){
  const el=$('calc-'+pid); if(!el)return;
  const {g,ins,irpf,espp,car,n}=netP(S.pessoas[pid]);
  el.innerHTML=`
    <div class="rl"><span class="la">Salário Bruto</span><span class="va">${fmt(g)}</span></div>
    <div class="rl"><span class="la">(-) INSS</span><span class="va ng">(${fmt(ins)})</span></div>
    <div class="rl"><span class="la">(-) IRPF</span><span class="va ng">(${fmt(irpf)})</span></div>
    <div class="rl"><span class="la">(-) ESPP (${S.pessoas[pid].espp||0}%)</span><span class="va ng">(${fmt(espp)})</span></div>
    <div class="rl"><span class="la">(-) Dedução Carro</span><span class="va ng">(${fmt(car)})</span></div>
    <div class="rl rtot"><span class="la" style="font-weight:600">Salário Líquido</span><span class="va ps hi">${fmt(n)}</span></div>`;
}

function updCasal(){
  const el=$('casal-res'); if(!el)return;
  const nN=netP(S.pessoas.noivo), nA=netP(S.pessoas.noiva);
  const nmN=S.pessoas.noivo.nome||'Noivo', nmA=S.pessoas.noiva.nome||'Noiva';
  el.innerHTML=`
    <div class="g2" style="margin-bottom:.85rem">
      <div class="mc"><div class="ml">${nmN}</div><div class="mv ps">${fmt(nN.n)}</div></div>
      <div class="mc"><div class="ml">${nmA}</div><div class="mv ps">${fmt(nA.n)}</div></div>
    </div>
    <div class="rl rtot" style="margin-top:0">
      <span class="la" style="font-weight:600">Receita Líquida Total do Casal</span>
      <span class="va hi ps">${fmt(nN.n+nA.n)}</span>
    </div>
    <p class="note">* Tabelas progressivas INSS e IRPF 2024/2025. ESPP e carro deduzidos do líquido. Dados sincronizados na nuvem (Supabase).</p>`;
}

window.rRec=function(){ updCalc('noivo'); updCalc('noiva'); updCasal(); };
window.upP=function(pid,f,v){
  S.pessoas[pid][f]=v;
  const t=$('ttl-'+pid);
  if(f==='nome'&&t) t.textContent=v||(pid==='noivo'?'Noivo':'Noiva');
  qs();
};

/* ============================================================
   ABA CUSTOS
   ============================================================ */
function rCustos(){
  const pane=$('pane-custos'); if(!pane)return;
  const rows=S.custos.map(c=>`<tr>
    <td><input class="tc" type="text" value="${esc(c.desc)}" placeholder="ex: Condomínio"
      style="min-width:140px" onchange="upC('${c.id}','desc',this.value)"></td>
    <td><select class="tc" onchange="upC('${c.id}','cat',this.value)">
      <option value="fixo"${c.cat==='fixo'?' selected':''}>Fixo</option>
      <option value="variavel"${c.cat==='variavel'?' selected':''}>Variável</option>
    </select></td>
    <td><select class="tc" onchange="upC('${c.id}','resp',this.value)" style="min-width:120px">
      <option value="ambos"${c.resp==='ambos'?' selected':''}>Ambos (50/50)</option>
      <option value="noivo"${c.resp==='noivo'?' selected':''}>Noivo</option>
      <option value="noiva"${c.resp==='noiva'?' selected':''}>Noiva</option>
    </select></td>
    <td style="text-align:right"><input class="tc" type="number" value="${c.val||0}"
      style="width:95px;text-align:right" onchange="upC('${c.id}','val',+this.value||0);cCRes()"></td>
    <td><button class="badb" onclick="rmC('${c.id}')">✕</button></td>
  </tr>`).join('');
  pane.innerHTML=`
    <div class="card">
      <div class="ct">📋 Custos Mensais</div>
      <div class="tbl-wrap"><table>
        <thead><tr>
          <th>Descrição</th><th>Categoria</th><th>Responsável</th>
          <th style="text-align:right">Valor (R$)</th><th></th>
        </tr></thead>
        <tbody id="ctbody">${rows}</tbody>
      </table></div>
      <button class="addb" onclick="addC()">＋ Adicionar custo</button>
    </div>
    <div class="card">
      <div class="ct">📊 Resumo de Custos</div>
      <div id="cres" class="g2"></div>
    </div>`;
  cCRes();
}

window.addC=function(){ S.custos.push({id:uid(),desc:'',cat:'fixo',resp:'ambos',val:0}); rCustos(); qs(); };
window.rmC =function(id){ S.custos=S.custos.filter(c=>c.id!==id); rCustos(); qs(); };
window.upC =function(id,f,v){ const c=S.custos.find(x=>x.id===id); if(c){c[f]=v;qs();} };

window.cCRes=function(){
  const el=$('cres'); if(!el)return;
  let fn=0,vn=0,fa=0,va=0;
  S.custos.forEach(c=>{
    const v=c.val||0, isF=c.cat==='fixo';
    if(c.resp==='noivo')      isF?(fn+=v):(vn+=v);
    else if(c.resp==='noiva') isF?(fa+=v):(va+=v);
    else { isF?(fn+=v/2,fa+=v/2):(vn+=v/2,va+=v/2); }
  });
  const nmN=S.pessoas.noivo.nome||'Noivo', nmA=S.pessoas.noiva.nome||'Noiva';
  el.innerHTML=`
    <div>
      <div class="rl"><span class="la">Fixos — ${nmN}</span><span class="va">${fmt(fn)}</span></div>
      <div class="rl"><span class="la">Variáveis — ${nmN}</span><span class="va">${fmt(vn)}</span></div>
      <div class="rl rtot"><span class="la" style="font-weight:600">Total — ${nmN}</span><span class="va hi">${fmt(fn+vn)}</span></div>
    </div>
    <div>
      <div class="rl"><span class="la">Fixos — ${nmA}</span><span class="va">${fmt(fa)}</span></div>
      <div class="rl"><span class="la">Variáveis — ${nmA}</span><span class="va">${fmt(va)}</span></div>
      <div class="rl rtot"><span class="la" style="font-weight:600">Total — ${nmA}</span><span class="va hi">${fmt(fa+va)}</span></div>
    </div>`;
};

/* ============================================================
   ABA CASAMENTO
   ============================================================ */
function rCasamento(){
  const pane=$('pane-casamento'); if(!pane)return;
  pane.innerHTML=`
    <div class="card">
      <div class="ct">💒 Gastos do Casamento</div>
      <div class="tbl-wrap"><table>
        <thead><tr>
          <th>Descrição</th><th>Responsável</th><th>% Noivo / % Noiva</th>
          <th style="text-align:center">Parcelas</th><th>Tipo</th>
          <th>Valor(es) por Parcela (R$)</th><th>Mês Início</th><th></th>
        </tr></thead>
        <tbody id="gbody"></tbody>
      </table></div>
      <button class="addb" onclick="addG()">＋ Adicionar gasto</button>
    </div>
    <div class="card">
      <div class="ct">📊 Resumo do Casamento</div>
      <div id="gres"></div>
    </div>`;
  rGBody();
}

function rGBody(){
  const tbody=$('gbody'); if(!tbody)return;
  tbody.innerHTML=S.casamento.map(g=>{
    const ambos=g.resp==='ambos';
    const percCell=ambos
      ?`<div style="display:flex;align-items:center;gap:4px;min-width:110px">
          <input class="tc" type="number" value="${g.pn||50}" min="0" max="100"
            style="width:47px;text-align:center" id="pn-${g.id}"
            onchange="upGP('${g.id}','pn',+this.value)">
          <span style="color:var(--text3)">/</span>
          <input class="tc" type="number" value="${g.pa||50}" min="0" max="100"
            style="width:47px;text-align:center" id="pa-${g.id}"
            onchange="upGP('${g.id}','pa',+this.value)">
        </div>`
      :`<span style="color:var(--text3);font-size:11px">${g.resp==='presente'?'Externo':'100%'}</span>`;

    let valCell = g.tipo==='fixo'
      ? `<input class="tc" type="number" value="${g.vf||0}"
           style="width:95px;text-align:right" onchange="upG('${g.id}','vf',+this.value||0)">`
      : Array.from({length:g.parc||1},(_,i)=>
          `<input class="tc" type="number" value="${(g.vv||[])[i]||0}"
             placeholder="${i+1}ª parc." style="width:70px;text-align:right;margin:1px"
             onchange="upGV('${g.id}',${i},+this.value||0)">`).join('');
    if(g.tipo==='variavel') valCell=`<div style="display:flex;flex-wrap:wrap;gap:2px;min-width:80px">${valCell}</div>`;

    return `<tr>
      <td><input class="tc" type="text" value="${esc(g.desc)}" placeholder="Descrição"
        style="min-width:130px" onchange="upG('${g.id}','desc',this.value)"></td>
      <td><select class="tc" onchange="upGR('${g.id}',this.value)" style="min-width:90px">
        <option value="ambos"${g.resp==='ambos'?' selected':''}>Ambos</option>
        <option value="noivo"${g.resp==='noivo'?' selected':''}>Noivo</option>
        <option value="noiva"${g.resp==='noiva'?' selected':''}>Noiva</option>
        <option value="presente"${g.resp==='presente'?' selected':''}>Presente</option>
      </select></td>
      <td>${percCell}</td>
      <td style="text-align:center">
        <input class="tc" type="number" value="${g.parc||1}" min="1"
          style="width:50px;text-align:center" onchange="upGPa('${g.id}',+this.value||1)">
      </td>
      <td><select class="tc" onchange="upGT('${g.id}',this.value)" style="min-width:75px">
        <option value="fixo"${g.tipo==='fixo'?' selected':''}>Fixo</option>
        <option value="variavel"${g.tipo==='variavel'?' selected':''}>Variável</option>
      </select></td>
      <td style="min-width:100px">${valCell}</td>
      <td><input class="tc" type="month" value="${g.inicio||''}" style="min-width:130px"
        onchange="upG('${g.id}','inicio',this.value)"></td>
      <td><button class="badb" onclick="rmG('${g.id}')">✕</button></td>
    </tr>`;
  }).join('');
  cGRes();
}

window.addG =function(){ S.casamento.push({id:uid(),desc:'',resp:'ambos',pn:50,pa:50,parc:1,tipo:'fixo',vf:0,vv:[0],inicio:''}); rGBody(); qs(); };
window.rmG  =function(id){ S.casamento=S.casamento.filter(g=>g.id!==id); rGBody(); qs(); };
window.upG  =function(id,f,v){ const g=S.casamento.find(x=>x.id===id); if(g){g[f]=v;cGRes();qs();} };
window.upGR =function(id,v){ const g=S.casamento.find(x=>x.id===id); if(g){g.resp=v;rGBody();qs();} };
window.upGP =function(id,f,v){
  const g=S.casamento.find(x=>x.id===id); if(!g)return;
  g[f]=v;
  if(f==='pn'){ g.pa=100-v; const e=$('pa-'+id); if(e)e.value=g.pa; }
  else         { g.pn=100-v; const e=$('pn-'+id); if(e)e.value=g.pn; }
  cGRes(); qs();
};
window.upGPa=function(id,n){
  const g=S.casamento.find(x=>x.id===id); if(!g)return;
  g.parc=n;
  while((g.vv||[]).length<n)(g.vv=g.vv||[]).push(0);
  g.vv=g.vv.slice(0,n); rGBody(); qs();
};
window.upGT =function(id,v){ const g=S.casamento.find(x=>x.id===id); if(g){g.tipo=v;rGBody();qs();} };
window.upGV =function(id,i,v){ const g=S.casamento.find(x=>x.id===id); if(g){if(!g.vv)g.vv=[];g.vv[i]=v;cGRes();qs();} };

function gTot(g){
  const t=g.tipo==='fixo'?(g.vf||0)*(g.parc||1):(g.vv||[]).reduce((a,b)=>a+(b||0),0);
  if(g.resp==='presente') return {n:0,a:0,pr:t};
  return {
    n : g.resp==='noivo'?t : g.resp==='ambos'?t*(g.pn||50)/100 : 0,
    a : g.resp==='noiva'?t : g.resp==='ambos'?t*(g.pa||50)/100 : 0,
    pr: 0
  };
}

window.cGRes=function(){
  const el=$('gres'); if(!el)return;
  let tN=0,tA=0,tP=0;
  S.casamento.forEach(g=>{ const {n,a,pr}=gTot(g); tN+=n; tA+=a; tP+=pr; });
  const nmN=S.pessoas.noivo.nome||'Noivo', nmA=S.pessoas.noiva.nome||'Noiva';
  el.innerHTML=`<div class="g2">
    <div>
      <div class="rl"><span class="la">Total — ${nmN}</span><span class="va">${fmt(tN)}</span></div>
      <div class="rl"><span class="la">Total — ${nmA}</span><span class="va">${fmt(tA)}</span></div>
      <div class="rl"><span class="la">Total — Presentes (terceiros)</span><span class="va">${fmt(tP)}</span></div>
    </div>
    <div>
      <div class="rl rtot" style="margin-top:0">
        <span class="la" style="font-weight:600">Total Geral</span>
        <span class="va hi">${fmt(tN+tA+tP)}</span>
      </div>
      <div class="rl" style="margin-top:6px">
        <span class="la">Total do Casal (excl. presentes)</span>
        <span class="va">${fmt(tN+tA)}</span>
      </div>
    </div>
  </div>`;
};

/* ============================================================
   ABA BUSINESS CASE
   ============================================================ */
function gMes(pid,m){
  let t=0;
  S.casamento.forEach(g=>{
    if(!g.inicio||g.resp==='presente') return;
    const d=mDiff(g.inicio,m);
    if(d<0||d>=(g.parc||1)) return;
    const v=g.tipo==='fixo'?(g.vf||0):((g.vv||[])[d]||0);
    if(pid==='noivo'){ if(g.resp==='noivo')t+=v; else if(g.resp==='ambos')t+=v*(g.pn||50)/100; }
    else             { if(g.resp==='noiva')t+=v; else if(g.resp==='ambos')t+=v*(g.pa||50)/100; }
  });
  return t;
}

function custoP(pid){
  let t=0;
  S.custos.forEach(c=>{
    const v=c.val||0;
    if(c.resp===pid) t+=v; else if(c.resp==='ambos') t+=v/2;
  });
  return t;
}

window.upBC=function(f,v){ S.bc[f]=v; qs(); rBC(); };

function rBC(){
  const pane=$('pane-bc'); if(!pane)return;
  const {data,inicio}=S.bc;
  const params=`
    <div class="card">
      <div class="ct">⚙️ Parâmetros da Projeção</div>
      <div class="g2">
        <div class="mb"><label class="fl">Data do Casamento</label>
          <input class="fi" type="month" value="${data||''}" onchange="upBC('data',this.value)"></div>
        <div class="mb"><label class="fl">Mês de Início da Projeção</label>
          <input class="fi" type="month" value="${inicio||''}" onchange="upBC('inicio',this.value)"></div>
      </div>
    </div>`;

  if(!data||!inicio){
    pane.innerHTML=params+`<div class="empty-state">
      <div style="font-size:36px;margin-bottom:.75rem">📈</div>
      <div style="font-size:14px;font-weight:600">Defina os parâmetros acima</div>
      <div style="margin-top:.5rem">Preencha a data do casamento e o mês de início da projeção para visualizar o Business Case</div>
    </div>`;
    return;
  }

  const sD=mToD(inicio), wD=mToD(data);
  if(!sD||!wD||sD>wD){
    pane.innerHTML=params+`<div style="text-align:center;padding:1.5rem;color:var(--red)">
      ⚠️ O mês de início deve ser anterior ao mês do casamento.</div>`;
    return;
  }

  const nN=netP(S.pessoas.noivo), nA=netP(S.pessoas.noiva);
  const cN=custoP('noivo'), cA=custoP('noiva');
  const nmN=S.pessoas.noivo.nome||'Noivo', nmA=S.pessoas.noiva.nome||'Noiva';

  const eD=addM(wD,2);
  const months=[]; let cur=new Date(sD);
  while(cur<=eD){ months.push(dToM(cur)); cur=addM(cur,1); }

  let sumSN=0,sumSA=0,sumGN=0,sumGA=0;
  const rows=months.map(m=>{
    const gN=gMes('noivo',m), gA=gMes('noiva',m);
    const sN=nN.n-cN-gN, sA=nA.n-cA-gA, sC=sN+sA;
    const isW=m===data;
    sumSN+=sN; sumSA+=sA; sumGN+=gN; sumGA+=gA;
    const fmtG=v=>v>0?`<span style="color:var(--warn);font-weight:500">${fmt(v)}</span>`
                    :`<span style="color:#ccc">—</span>`;
    return `<tr${isW?' style="background:var(--warn-bg)"':''}>
      <td style="font-weight:${isW?600:400};white-space:nowrap">${fmtM(m)}${isW?' 💍':''}</td>
      <td style="text-align:right">${fmt(nN.n)}</td>
      <td style="text-align:right">${fmt(nA.n)}</td>
      <td style="text-align:right">${fmt(cN)}</td>
      <td style="text-align:right">${fmt(cA)}</td>
      <td style="text-align:right">${fmtG(gN)}</td>
      <td style="text-align:right">${fmtG(gA)}</td>
      <td style="text-align:right" class="${sN>=0?'posv':'negv'}">${fmtS(sN)}</td>
      <td style="text-align:right" class="${sA>=0?'posv':'negv'}">${fmtS(sA)}</td>
      <td style="text-align:right;font-weight:600" class="${sC>=0?'posv':'negv'}">${fmtS(sC)}</td>
    </tr>`;
  });

  const mn=months.length;
  pane.innerHTML=params+`
    <div class="g3" style="margin-bottom:1rem">
      <div class="mc">
        <div class="ml">Superávit médio/mês — ${nmN}</div>
        <div class="mv ${sumSN/mn>=0?'ps':'ng'}">${fmt(sumSN/mn)}</div>
      </div>
      <div class="mc">
        <div class="ml">Superávit médio/mês — ${nmA}</div>
        <div class="mv ${sumSA/mn>=0?'ps':'ng'}">${fmt(sumSA/mn)}</div>
      </div>
      <div class="mc">
        <div class="ml">Superávit total do período — Casal</div>
        <div class="mv ${(sumSN+sumSA)>=0?'ps':'ng'}">${fmt(sumSN+sumSA)}</div>
      </div>
      <div class="mc">
        <div class="ml">Total Casamento — ${nmN}</div>
        <div class="mv wn">${fmt(sumGN)}</div>
      </div>
      <div class="mc">
        <div class="ml">Total Casamento — ${nmA}</div>
        <div class="mv wn">${fmt(sumGA)}</div>
      </div>
      <div class="mc">
        <div class="ml">Total Casamento — Casal</div>
        <div class="mv wn">${fmt(sumGN+sumGA)}</div>
      </div>
    </div>
    <div class="card">
      <div class="ct">📅 Projeção Mês a Mês</div>
      <div class="tbl-wrap">
        <table style="min-width:860px">
          <thead><tr>
            <th>Mês</th>
            <th style="text-align:right">Receita ${nmN}</th>
            <th style="text-align:right">Receita ${nmA}</th>
            <th style="text-align:right">Custos ${nmN}</th>
            <th style="text-align:right">Custos ${nmA}</th>
            <th style="text-align:right">Casamento ${nmN}</th>
            <th style="text-align:right">Casamento ${nmA}</th>
            <th style="text-align:right">Superávit ${nmN}</th>
            <th style="text-align:right">Superávit ${nmA}</th>
            <th style="text-align:right">Superávit Casal</th>
          </tr></thead>
          <tbody>${rows.join('')}</tbody>
        </table>
      </div>
      <p class="note">💍 Destaque amarelo = mês do casamento · Verde = superávit · Vermelho = déficit</p>
    </div>`;
}

/* ============================================================
   INIT
   ============================================================ */
load();
</script>
</body>
</html>
