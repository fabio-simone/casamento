<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>#kafamento</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0c0b13;--card:#12101e;--card2:#18162a;--card3:#1e1b30;
  --border:#252040;--border2:#352f58;
  --orange:#f97316;--orange-bg:rgba(249,115,22,.08);
  --purple:#9b6dff;
  --text:#ede8ff;--text2:#8880a8;--text3:#4a4568;
  --teal:#34d399;--teal-bg:rgba(52,211,153,.07);
  --red:#f87171;--red-bg:rgba(248,113,113,.07);
  --warn:#fb923c;--warn-bg:rgba(251,146,60,.07);
  --radius:12px;--radius-sm:8px;
}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:13px;min-height:100vh}
#auth{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:999}
.auth-wrap{width:340px;text-align:center}
.auth-icon{width:52px;height:52px;margin:0 auto 1.5rem;border:1.5px solid var(--border2);border-radius:50%;display:flex;align-items:center;justify-content:center}
.auth-title{font-size:18px;font-weight:600;margin-bottom:.35rem}
.auth-sub{font-size:12px;color:var(--text2);margin-bottom:2rem}
.auth-box{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:2rem}
.auth-inp{width:100%;padding:11px 14px;background:var(--card2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:14px;font-family:inherit;letter-spacing:.08em;margin-bottom:1rem;transition:border .2s}
.auth-inp:focus{outline:none;border-color:var(--orange)}
.auth-btn{width:100%;padding:11px;background:var(--orange);border:none;border-radius:var(--radius-sm);color:#fff;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit;transition:opacity .2s}
.auth-btn:hover{opacity:.87}
.auth-err{font-size:12px;color:var(--red);margin-top:.75rem;min-height:16px}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.shake{animation:shake .35s ease}
.app{max-width:1220px;margin:0 auto}
.hdr{background:var(--card);border-bottom:1px solid var(--border);padding:.9rem 1.5rem;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:50}
.hdr-t{font-size:15px;font-weight:600;display:flex;align-items:center;gap:9px}
.hdr-s{font-size:11px;color:var(--text3);margin-top:2px}
.sp{font-size:11px;padding:3px 12px;border-radius:20px;border:1px solid transparent;min-width:70px;text-align:center;font-weight:500;transition:all .3s}
.sp.saving{color:var(--warn);border-color:rgba(251,146,60,.4);background:var(--warn-bg)}
.sp.saved{color:var(--teal);border-color:rgba(52,211,153,.4);background:var(--teal-bg)}
.sp.err{color:var(--red);border-color:rgba(248,113,113,.4);background:var(--red-bg)}
.tbar{background:var(--card);border-bottom:1px solid var(--border);display:flex;padding:0 1.5rem;overflow-x:auto}
.tb{padding:.7rem 1.2rem;font-size:12.5px;color:var(--text2);background:transparent;border:none;border-bottom:2px solid transparent;cursor:pointer;display:flex;align-items:center;gap:7px;white-space:nowrap;transition:color .15s;font-family:inherit;font-weight:400}
.tb:hover{color:var(--text)}
.tb.active{color:var(--orange);font-weight:600;border-bottom-color:var(--orange)}
.pane{display:none;padding:1.5rem}
.pane.on{display:block}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem;margin-bottom:1rem;transition:border .2s}
.card:hover{border-color:var(--border2)}
.ct{font-size:13.5px;font-weight:600;margin-bottom:1rem;display:flex;align-items:center;gap:8px}
.ct svg{color:var(--orange);flex-shrink:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.fl{font-size:10.5px;color:var(--text2);margin-bottom:5px;display:block;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.fi{width:100%;padding:8px 11px;background:var(--card2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-family:inherit;font-size:13px;transition:border .2s}
.fi:focus{outline:none;border-color:var(--orange)}
.fi::placeholder{color:var(--text3)}
.mb{margin-bottom:.85rem}
.rl{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px}
.rl:last-child{border-bottom:none}
.rl .la{color:var(--text2)}
.rl .va{font-weight:500}
.rl .va.ng{color:var(--red);font-weight:400}
.rl .va.ps{color:var(--teal)}
.rl .va.hi{font-size:15px;font-weight:600}
.rtot{border-top:1px solid var(--border2)!important;margin-top:6px!important;padding-top:8px!important;border-bottom:none!important}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{font-size:10.5px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;padding:9px 10px;text-align:left;background:var(--card2);border-bottom:1px solid var(--border)}
td{padding:7px 9px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,.012)}
.tc{width:100%;padding:6px 8px;background:var(--card2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-family:inherit;font-size:12.5px;transition:border .2s}
.tc:focus{outline:none;border-color:var(--orange)}
.tc::placeholder{color:var(--text3)}
.mc{background:var(--card2);border:1px solid var(--border);border-radius:var(--radius);padding:1rem;text-align:center}
.mc .ml{font-size:10.5px;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.mc .mv{font-size:20px;font-weight:600;margin-top:5px}
.mc .mv.ps{color:var(--teal)}
.mc .mv.ng{color:var(--red)}
.mc .mv.wn{color:var(--orange)}
.mc .mv.pu{color:var(--purple)}
.badb{font-size:11px;padding:4px 9px;color:var(--red);border:1px solid rgba(248,113,113,.3);background:transparent;border-radius:var(--radius-sm);cursor:pointer;font-family:inherit;transition:all .2s;display:flex;align-items:center}
.badb:hover{background:var(--red-bg)}
.addb{width:100%;margin-top:.8rem;font-size:12.5px;padding:9px;color:var(--text3);border:1px dashed var(--border2);border-radius:var(--radius);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;font-family:inherit;transition:all .2s}
.addb:hover{border-color:var(--orange);color:var(--orange);background:var(--orange-bg)}
.empty-state{text-align:center;padding:3rem;color:var(--text3);border:1px dashed var(--border2);border-radius:var(--radius)}
.note{font-size:11px;color:var(--text3);margin-top:.75rem}
.mp-wrap{position:relative;width:100%}
.mp-btn{width:100%;padding:8px 11px;background:var(--card2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-family:inherit;font-size:13px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;transition:border .2s;text-align:left}
.mp-btn:hover,.mp-btn.open{border-color:var(--orange)}
.mp-ph{color:var(--text3)}
.mp-drop{position:fixed;background:var(--card);border:1px solid var(--border2);border-radius:var(--radius);padding:.9rem;z-index:500;box-shadow:0 16px 40px rgba(0,0,0,.6);min-width:210px;display:none}
.mp-hdr{display:flex;align-items:center;gap:6px;margin-bottom:.8rem}
.mp-yr{font-size:14px;font-weight:600;color:var(--text);flex:1;text-align:center}
.mp-nav{background:var(--card2);border:1px solid var(--border);color:var(--text2);cursor:pointer;font-size:15px;padding:3px 10px;border-radius:6px;font-family:inherit;line-height:1;transition:all .15s}
.mp-nav:hover{border-color:var(--orange);color:var(--orange)}
.mp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.mp-m{padding:9px 4px;text-align:center;border:1px solid transparent;background:transparent;color:var(--text2);border-radius:var(--radius-sm);cursor:pointer;font-size:12px;font-family:inherit;transition:all .15s;width:100%}
.mp-m:hover{background:var(--card2);color:var(--text);border-color:var(--border)}
.mp-m.sel{background:var(--orange);color:#fff;font-weight:600;border-color:var(--orange)}
.bc-wrap{overflow-x:auto;border-radius:var(--radius-sm)}
.bc-tbl{border-collapse:collapse;font-size:12px;white-space:nowrap}
.bc-tbl th,.bc-tbl td{padding:7px 12px;border-bottom:1px solid var(--border)}
.bc-tbl th{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text3);background:var(--card2);text-align:right;border-bottom:1px solid var(--border2)}
.bc-tbl th.lh{text-align:left;min-width:185px;position:sticky;left:0;z-index:3;background:var(--card2)}
.sticky{position:sticky;left:0;z-index:2;border-right:1px solid var(--border2)}
.sec-row td{background:var(--card3);color:var(--orange);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;padding:6px 12px;border-bottom:1px solid var(--border2)}
.sec-row .sticky{background:var(--card3)}
.sub-row td{background:var(--card2);font-weight:600}
.sub-row .sticky{background:var(--card2)}
.caixa-row td{background:rgba(52,211,153,.05);font-weight:700;border-top:2px solid var(--border2);border-bottom:2px solid var(--border2)}
.caixa-row .sticky{background:#0e1c18}
.bc-tbl tr:not(.sec-row):not(.sub-row):not(.caixa-row):hover td{background:rgba(255,255,255,.015)}
.sum-sep{border-left:2px solid var(--border2)!important}
.bc-tbl td{text-align:right;color:var(--text2)}
.bc-tbl td.sticky{text-align:left;color:var(--text);background:var(--card)}
.bc-grp{cursor:pointer;user-select:none}
.bc-grp:hover td{filter:brightness(1.2)}
.bc-det{display:none}
.bc-det td.sticky{padding-left:2.5rem;color:var(--text2)}
.bc-arrow{display:inline-block;font-size:9px;margin-right:5px;transition:transform .2s;color:var(--text3)}
.bc-arrow.open{transform:rotate(90deg)}
.dev-pos{color:var(--teal)!important;font-weight:600}
.dev-neg{color:var(--red)!important;font-weight:600}
.bc-mode-bar{display:flex;gap:6px;margin-bottom:1rem;flex-wrap:wrap}
.bc-mode-btn{padding:5px 16px;font-size:12px;font-weight:500;border-radius:20px;border:1px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer;font-family:inherit;transition:all .2s}
.bc-mode-btn.on{background:var(--orange);color:#fff;border-color:var(--orange)}
.real-tbl th{background:var(--card2);color:var(--text3);font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;padding:8px 10px;border-bottom:1px solid var(--border)}
.real-tbl td{padding:6px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
.real-tbl tr:last-child td{border-bottom:none}
.real-sub td{background:var(--card2);font-weight:700;border-top:1px solid var(--border2)}
#loading{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:998;gap:14px}
.spin{width:34px;height:34px;border:2.5px solid var(--border2);border-top-color:var(--orange);border-radius:50%;animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
#loading p{font-size:13px;color:var(--text2)}
@media(max-width:700px){.g2{grid-template-columns:1fr}.pane{padding:1rem}.hdr{padding:.8rem 1rem}}
</style>
</head>
<body>
<div id="auth">
  <div class="auth-wrap">
    <div class="auth-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--orange)" stroke-width="1.5"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></div>
    <div class="auth-title">#kafamento</div>
    <div class="auth-sub">Planejamento financeiro do casal</div>
    <div class="auth-box" id="auth-box">
      <input class="auth-inp" type="password" id="auth-inp" placeholder="Senha de acesso" onkeydown="if(event.key==='Enter')checkAuth()">
      <button class="auth-btn" onclick="checkAuth()">Entrar</button>
      <div id="auth-err" class="auth-err"></div>
    </div>
  </div>
</div>
<div id="loading" style="display:none"><div class="spin"></div><p>Carregando dados...</p></div>
<div class="app" id="app-shell" style="display:none">
  <div class="hdr">
    <div>
      <div class="hdr-t"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--orange)" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>#kafamento</div>
      <div class="hdr-s">dados sincronizados na nuvem</div>
    </div>
    <span id="sp" class="sp"></span>
  </div>
  <div class="tbar">
    <button class="tb active" data-t="receitas" onclick="goTab('receitas')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>Receitas</button>
    <button class="tb" data-t="custos" onclick="goTab('custos')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>Custos</button>
    <button class="tb" data-t="casamento" onclick="goTab('casamento')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>Casamento</button>
    <button class="tb" data-t="bc" onclick="goTab('bc')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>Business Case</button>
    <button class="tb" data-t="realizado" onclick="goTab('realizado')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>Realizado</button>
  </div>
  <div id="pane-receitas"  class="pane on"  data-t="receitas"></div>
  <div id="pane-custos"    class="pane"     data-t="custos"></div>
  <div id="pane-casamento" class="pane"     data-t="casamento"></div>
  <div id="pane-bc"        class="pane"     data-t="bc"></div>
  <div id="pane-realizado" class="pane"     data-t="realizado"></div>
</div>
<script>
const PASSWORD='#ka&fa_2026';
const SB_URL='https://qyxvnjlosiblcmnubqyp.supabase.co';
const SB_KEY='sb_publishable_LRsXfh8V1O7PLW2RbdrYZw_t6u1r1wf';
const SB_H={'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY};

function checkAuth(){
  const v=$('auth-inp').value.trim();
  if(v===PASSWORD){sessionStorage.setItem('wbc_auth','1');$('auth').style.display='none';initApp();}
  else{$('auth-err').textContent='Senha incorreta.';$('auth-box').classList.remove('shake');void $('auth-box').offsetWidth;$('auth-box').classList.add('shake');$('auth-inp').value='';$('auth-inp').focus();}
}
window.addEventListener('load',()=>{
  if(sessionStorage.getItem('wbc_auth')==='1'){$('auth').style.display='none';initApp();}
  else setTimeout(()=>$('auth-inp').focus(),100);
});

const $=id=>document.getElementById(id);
const MN=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const MNS=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const uid=()=>Math.random().toString(36).substr(2,9);
const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const fmt=v=>'R$\u00a0'+(+v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtS=v=>(v>=0?'+':'')+fmt(v);
const fmtMV=s=>{if(!s)return'';const[y,m]=s.split('-').map(Number);return MN[m-1]+' / '+y;};
const mToD=s=>{if(!s)return null;const[y,m]=s.split('-').map(Number);return new Date(y,m-1,1);};
const addM=(d,n)=>{const r=new Date(d);r.setMonth(r.getMonth()+n);return r;};
const dToM=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
const mDiff=(a,b)=>{const da=mToD(a),db=mToD(b);if(!da||!db)return-1;return(db.getFullYear()-da.getFullYear())*12+(db.getMonth()-da.getMonth());};
const sumArr=a=>a.reduce((s,v)=>s+v,0);

let curTab='receitas',saveT=null,bcMode='plan',realizadoMes='';
let S={
  pessoas:{noivo:{nome:'',salario:0,carro:0,espp:0},noiva:{nome:'',salario:0,carro:0,espp:0}},
  custos:[],casamento:[],presentes:[],realizado:{},bc:{data:'',inicio:''}
};

function calcINSS(g){
  if(!g)return 0;
  const f=[{l:1412,r:.075},{l:2666.68,r:.09},{l:4000.03,r:.12},{l:7786.02,r:.14}];
  let ins=0,p=0;for(const x of f){if(g<=p)break;ins+=(Math.min(g,x.l)-p)*x.r;p=x.l;if(g<=x.l)break;}
  return Math.min(ins,908.86);
}
function calcIRPF(b){
  if(b<=2259.20)return 0;
  const f=[{l:2826.65,r:.075,d:169.44},{l:3751.05,r:.15,d:381.44},{l:4664.68,r:.225,d:662.77},{l:Infinity,r:.275,d:896}];
  for(const x of f)if(b<=x.l)return Math.max(0,b*x.r-x.d);return 0;
}
function netP(p){
  const g=p.salario||0,ins=calcINSS(g),irpf=calcIRPF(g-ins),espp=g*(p.espp||0)/100,car=p.carro||0;
  return{g,ins,irpf,espp,car,n:g-ins-irpf-espp-car};
}

let lastKnownServerTs=null;

async function fetchFromServer(){
  const r=await fetch(SB_URL+'/rest/v1/wedding_data?id=eq.main&select=data,updated_at',{headers:SB_H});
  if(!r.ok)throw new Error('fetch failed: '+r.status);
  const rows=await r.json();
  if(rows&&rows.length>0&&rows[0].data){
    lastKnownServerTs=rows[0].updated_at||null;
    return rows[0].data;
  }
  return null;
}

function mergeState(local,remote){
  if(!remote)return local;
  // Para arrays de itens com id, o mais recente (pelo ts) vence no nível do array inteiro.
  // Para realizado (objeto chave→valor) fazemos merge chave a chave.
  const merged={...remote,...local};
  // Realizado: mescla chave-a-chave para não perder lançamentos de outra sessão
  merged.realizado={...( remote.realizado||{}),...(local.realizado||{})};
  return merged;
}

async function save(){
  setSP('saving');
  try{
    // 1. Busca versão atual do servidor
    const serverData=await fetchFromServer();
    // 2. Merge: mantém dados locais mas recupera o que a outra sessão possa ter adicionado
    S=mergeState(S,serverData);
    // 3. Garante campos obrigatórios
    if(!S.pessoas)S.pessoas={noivo:{nome:'',salario:0,carro:0,espp:0},noiva:{nome:'',salario:0,carro:0,espp:0}};
    if(!S.custos)S.custos=[];if(!S.casamento)S.casamento=[];if(!S.presentes)S.presentes=[];if(!S.realizado)S.realizado={};if(!S.bc)S.bc={data:'',inicio:''};
    // 4. Persiste o estado mergeado
    const now=new Date().toISOString();
    const r=await fetch(SB_URL+'/rest/v1/wedding_data',{method:'POST',headers:{...SB_H,'Prefer':'resolution=merge-duplicates'},body:JSON.stringify({id:'main',data:S,updated_at:now})});
    if(r.ok){lastKnownServerTs=now;setSP('saved');}
    else{console.error(r.status);setSP('err');}
  }catch(e){console.error(e);setSP('err');}
}

async function load(){
  try{
    const d=await fetchFromServer();
    if(d){
      S={...S,...d};
      if(!S.pessoas)S.pessoas={noivo:{nome:'',salario:0,carro:0,espp:0},noiva:{nome:'',salario:0,carro:0,espp:0}};
      if(!S.custos)S.custos=[];if(!S.casamento)S.casamento=[];if(!S.presentes)S.presentes=[];if(!S.realizado)S.realizado={};if(!S.bc)S.bc={data:'',inicio:''};
    }
  }catch(e){console.error(e);}
  if(!S.casamento.length)initDef();
  $('loading').style.display='none';$('app-shell').style.display='block';
  renderAll();
}

const mpSt={};
function mpCreate(id,val){
  const y=val?parseInt(val.split('-')[0]):new Date().getFullYear();
  mpSt[id]={year:y,val:val||''};
  return`<div class="mp-wrap">
    <button class="mp-btn" id="${id}-btn" type="button" onclick="mpToggle('${id}',event)">
      <span id="${id}-lbl"${val?'':' class="mp-ph"'}>${val?fmtMV(val):'Selecionar mês'}</span>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
    </button>
    <div class="mp-drop" id="${id}-drop">
      <div class="mp-hdr">
        <button class="mp-nav" type="button" onclick="mpNav('${id}',-1,event)">&#8249;</button>
        <span class="mp-yr" id="${id}-yr">${y}</span>
        <button class="mp-nav" type="button" onclick="mpNav('${id}',1,event)">&#8250;</button>
      </div>
      <div class="mp-grid" id="${id}-grid"></div>
    </div>
  </div>`;
}
function mpToggle(id,ev){
  ev&&ev.stopPropagation();
  const drop=$(`${id}-drop`);if(!drop)return;
  const isOpen=drop.style.display==='block';
  document.querySelectorAll('.mp-drop').forEach(d=>d.style.display='none');
  document.querySelectorAll('.mp-btn').forEach(b=>b.classList.remove('open'));
  if(!isOpen){
    const btn=$(`${id}-btn`),rect=btn.getBoundingClientRect();
    drop.style.cssText=`display:block;left:${rect.left}px;top:${rect.bottom+5}px;width:${Math.max(rect.width,210)}px`;
    btn.classList.add('open');
    mpDrawGrid(id);
  }
}
function mpNav(id,dir,ev){
  ev&&ev.stopPropagation();
  mpSt[id].year+=dir;
  $(`${id}-yr`).textContent=mpSt[id].year;
  mpDrawGrid(id);
}
function mpDrawGrid(id){
  const grid=$(`${id}-grid`);if(!grid)return;
  const st=mpSt[id],selM=st.val?st.val.split('-')[1]:'',selY=st.val?st.val.split('-')[0]:'';
  grid.innerHTML=MNS.map((n,i)=>{
    const m=String(i+1).padStart(2,'0');
    return`<button class="mp-m${m===selM&&String(st.year)===selY?' sel':''}" type="button" onclick="mpPick('${id}','${m}',event)">${n}</button>`;
  }).join('');
}
function mpPick(id,month,ev){
  ev&&ev.stopPropagation();
  const st=mpSt[id];if(!st)return;
  st.val=`${st.year}-${month}`;
  const lbl=$(`${id}-lbl`);if(lbl){lbl.textContent=fmtMV(st.val);lbl.className='';}
  $(`${id}-drop`).style.display='none';
  $(`${id}-btn`).classList.remove('open');
  if(id==='bc-data'){S.bc.data=st.val;qs();rBCTable();}
  else if(id==='bc-inicio'){S.bc.inicio=st.val;qs();rBCTable();}
  else if(id.startsWith('gd-')){const g=S.casamento.find(x=>x.id===id.slice(3));if(g){g.inicio=st.val;qs();}}
  else if(id.startsWith('pd-')){const p=(S.presentes||[]).find(x=>x.id===id.slice(3));if(p){p.inicio=st.val;qs();}}
  else if(id.startsWith('cm-')){const c=S.custos.find(x=>x.id===id.slice(3));if(c){c.mesRef=st.val;qs();}}
}

/* ── CASAMENTO ── */
function rCasamento(){
  const pane=$('pane-casamento');if(!pane)return;
  pane.innerHTML=`<div class="card"><div class="ct"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--orange)" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>Gastos do Casamento</div>
    <div class="tbl-wrap"><table><thead><tr><th>Descrição</th><th>Responsável</th><th>% Noivo / % Noiva</th><th style="text-align:center">Parcelas</th><th>Tipo</th><th>Valor(es) por Parcela (R$)</th><th style="text-align:right;min-width:130px">Total</th><th style="min-width:160px">Mês Início</th><th></th></tr></thead><tbody id="gbody"></tbody></table></div>
    <button class="addb" onclick="addG()"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Adicionar gasto</button>
  </div>
  <div class="card"><div class="ct"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--orange)" stroke-width="2"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></svg>Resumo do Casamento</div><div id="gres"></div></div>`;
  rGBody();
}
function gTot(g){
  const t=g.tipo==='fixo'?(g.vf||0)*(g.parc||1):(g.vv||[]).reduce((s,v)=>s+(v||0),0);
  if(g.resp==='presente')return{t,n:0,a:0,pr:t};
  const pn=g.pn!=null?+g.pn:50,pa=g.pa!=null?+g.pa:50;
  return{t,n:g.resp==='noivo'?t:g.resp==='ambos'?t*pn/100:0,a:g.resp==='noiva'?t:g.resp==='ambos'?t*pa/100:0,pr:0};
}
function rGBody(){
  const tbody=$('gbody');if(!tbody)return;
  tbody.innerHTML=S.casamento.map(g=>{
    const pn=g.pn!=null?+g.pn:50,pa=g.pa!=null?+g.pa:50;
    const pc=g.resp==='ambos'
      ?`<div style="display:flex;align-items:center;gap:5px;min-width:110px"><input class="tc" type="number" value="${pn}" min="0" max="100" style="width:48px;text-align:center" id="pn-${g.id}" onchange="upGP('${g.id}','pn',+this.value)"><span style="color:var(--text3)">/</span><input class="tc" type="number" value="${pa}" min="0" max="100" style="width:48px;text-align:center" id="pa-${g.id}" onchange="upGP('${g.id}','pa',+this.value)"></div>`
      :`<span style="color:var(--text3);font-size:11px">${g.resp==='presente'?'Externo':'100%'}</span>`;
    let vc=g.tipo==='fixo'
      ?`<input class="tc" type="number" value="${g.vf||0}" style="width:100px;text-align:right" oninput="upG('${g.id}','vf',+this.value||0);updGTotal('${g.id}')">`
      :Array.from({length:g.parc||1},(_,i)=>`<input class="tc" type="number" value="${(g.vv||[])[i]||0}" placeholder="parc.${i+1}" style="width:72px;text-align:right;margin:1px" oninput="upGV('${g.id}',${i},+this.value||0);updGTotal('${g.id}')">`).join('');
    if(g.tipo==='variavel')vc=`<div style="display:flex;flex-wrap:wrap;gap:2px">${vc}</div>`;
    const{t,n,a}=gTot(g);
    const split=g.resp==='ambos'&&t>0?`<div style="font-size:10px;color:var(--text3);margin-top:3px;line-height:1.6">${fmt(n)}<br>${fmt(a)}</div>`:'';
    return`<tr>
      <td><input class="tc" type="text" value="${esc(g.desc)}" placeholder="Descrição" style="min-width:130px" onchange="upG('${g.id}','desc',this.value)"></td>
      <td><select class="tc" onchange="upGR('${g.id}',this.value)" style="min-width:90px"><option value="ambos"${g.resp==='ambos'?' selected':''}>Ambos</option><option value="noivo"${g.resp==='noivo'?' selected':''}>Noivo</option><option value="noiva"${g.resp==='noiva'?' selected':''}>Noiva</option><option value="presente"${g.resp==='presente'?' selected':''}>Presente</option></select></td>
      <td>${pc}</td>
      <td style="text-align:center"><input class="tc" type="number" value="${g.parc||1}" min="1" style="width:52px;text-align:center" onchange="upGPa('${g.id}',+this.value||1)"></td>
      <td><select class="tc" onchange="upGT('${g.id}',this.value)" style="min-width:78px"><option value="fixo"${g.tipo==='fixo'?' selected':''}>Fixo</option><option value="variavel"${g.tipo==='variavel'?' selected':''}>Variável</option></select></td>
      <td style="min-width:105px">${vc}</td>
      <td id="gtot-${g.id}" style="text-align:right;vertical-align:top;padding-top:8px">${t>0?`<div style="text-align:right;font-weight:600;white-space:nowrap">${fmt(t)}${split}</div>`:'<span style="color:var(--text3)">—</span>'}</td>
      <td style="min-width:170px">${mpCreate('gd-'+g.id,g.inicio||'')}</td>
      <td><button class="badb" onclick="rmG('${g.id}')"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></td>
    </tr>`;
  }).join('');cGRes();
}
window.addG=function(){S.casamento.push({id:uid(),desc:'',resp:'ambos',pn:50,pa:50,parc:1,tipo:'fixo',vf:0,vv:[0],inicio:''});rGBody();qs();};
window.rmG=function(id){S.casamento=S.casamento.filter(g=>g.id!==id);rGBody();qs();};
window.updGTotal=function(id){
  const cell=$('gtot-'+id);if(!cell)return;
  const g=S.casamento.find(x=>x.id===id);if(!g)return;
  const{t,n,a}=gTot(g);
  const split=g.resp==='ambos'&&t>0?`<div style="font-size:10px;color:var(--text3);margin-top:3px;line-height:1.6">${fmt(n)}<br>${fmt(a)}</div>`:'';
  cell.innerHTML=t>0?`<div style="text-align:right;font-weight:600;white-space:nowrap">${fmt(t)}${split}</div>`:'<span style="color:var(--text3)">—</span>';
  cGRes();
};
window.upG=function(id,f,v){const g=S.casamento.find(x=>x.id===id);if(g){g[f]=v;qs();}};
window.upGR=function(id,v){const g=S.casamento.find(x=>x.id===id);if(g){g.resp=v;rGBody();qs();}};
window.upGP=function(id,f,v){const g=S.casamento.find(x=>x.id===id);if(!g)return;g[f]=v;if(f==='pn'){g.pa=100-v;const e=$('pa-'+id);if(e)e.value=g.pa;}else{g.pn=100-v;const e=$('pn-'+id);if(e)e.value=g.pn;}updGTotal(id);qs();};
window.upGPa=function(id,n){const g=S.casamento.find(x=>x.id===id);if(!g)return;g.parc=n;while((g.vv||[]).length<n)(g.vv=g.vv||[]).push(0);g.vv=g.vv.slice(0,n);rGBody();qs();};
window.upGT=function(id,v){const g=S.casamento.find(x=>x.id===id);if(g){g.tipo=v;rGBody();qs();}};
window.upGV=function(id,i,v){const g=S.casamento.find(x=>x.id===id);if(g){if(!g.vv)g.vv=[];g.vv[i]=v;qs();}};
window.cGRes=function(){
  const el=$('gres');if(!el)return;
  let tN=0,tA=0,tP=0;
  const nmN=S.pessoas.noivo.nome||'Noivo',nmA=S.pessoas.noiva.nome||'Noiva';
  const linhas=S.casamento.map(g=>{
    const{t,n,a,pr}=gTot(g);tN+=n;tA+=a;tP+=pr;
    if(t===0)return'';
    const pn=g.pn!=null?+g.pn:50,pa=g.pa!=null?+g.pa:50;
    const split=g.resp==='ambos'?` <span style="color:var(--text3);font-size:10px">(${pn}% / ${pa}%)</span>`:g.resp==='noivo'?` <span style="color:var(--text3);font-size:10px">(${nmN})</span>`:g.resp==='noiva'?` <span style="color:var(--text3);font-size:10px">(${nmA})</span>`:` <span style="color:var(--text3);font-size:10px">(Presente)</span>`;
    const vals=g.resp==='ambos'?`<span style="color:var(--orange)">${fmt(n)}</span> / <span style="color:var(--purple)">${fmt(a)}</span>`:g.resp==='noivo'?`<span style="color:var(--orange)">${fmt(n)}</span>`:g.resp==='noiva'?`<span style="color:var(--purple)">${fmt(a)}</span>`:`<span style="color:var(--text2)">${fmt(pr)}</span>`;
    return`<div class="rl" style="font-size:12px"><span class="la" style="flex:1">${esc(g.desc)||'—'}${split}</span><span>${vals}</span></div>`;
  }).join('');
  el.innerHTML=`<div style="margin-bottom:.9rem">${linhas||'<div style="color:var(--text3);font-size:12px;padding:.5rem 0">Nenhum gasto cadastrado</div>'}</div>
    <div class="g2" style="border-top:1px solid var(--border2);padding-top:.9rem;margin-top:.5rem">
      <div>
        <div class="rl"><span class="la">Total ${nmN}</span><span class="va" style="color:var(--orange)">${fmt(tN)}</span></div>
        <div class="rl"><span class="la">Total ${nmA}</span><span class="va" style="color:var(--purple)">${fmt(tA)}</span></div>
        <div class="rl"><span class="la">Total Presentes</span><span class="va">${fmt(tP)}</span></div>
      </div>
      <div>
        <div class="rl rtot" style="margin-top:0"><span class="la" style="font-weight:600">Total do Casal</span><span class="va hi">${fmt(tN+tA)}</span></div>
        <div class="rl" style="margin-top:6px"><span class="la">Total Geral (incl. presentes)</span><span class="va">${fmt(tN+tA+tP)}</span></div>
      </div>
    </div>`;
};

/* ── REALIZADO ── */
window.setBCMode=function(m){bcMode=m;document.querySelectorAll('.bc-mode-btn').forEach(b=>b.classList.toggle('on',b.dataset.m===m));rBCTable();};

function getProjectionMonths(){
  const{data,inicio}=S.bc;if(!data||!inicio)return[];
  const sD=mToD(inicio),wD=mToD(data);if(!sD||!wD||sD>wD)return[];
  const eD=addM(wD,2),months=[];let cur=new Date(sD);
  while(cur<=eD){months.push(dToM(cur));cur=addM(cur,1);}
  return months;
}
function planValCus(c,m){
  if(c.recorrente===false)return(m&&c.mesRef&&m===c.mesRef)?(c.val||0):0;
  return c.val||0;
}
function planValWed(g,m){
  if(!g.inicio)return 0;const d=mDiff(g.inicio,m);
  if(d<0||d>=(g.parc||1))return 0;
  return g.tipo==='fixo'?(g.vf||0):((g.vv||[])[d]||0);
}

function rRealizado(){
  const pane=$('pane-realizado');if(!pane)return;
  if(!realizadoMes){realizadoMes=dToM(new Date());}
  const months=getProjectionMonths();
  const nmN=S.pessoas.noivo.nome||'Noivo',nmA=S.pessoas.noiva.nome||'Noiva';
  const mSel=months.length
    ?`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:1rem">${months.map(m=>`<button onclick="realizadoMes='${m}';rRealizado()" style="padding:5px 14px;font-size:12px;border-radius:20px;border:1px solid var(--${m===realizadoMes?'orange':'border2'});background:${m===realizadoMes?'var(--orange)':'transparent'};color:${m===realizadoMes?'#fff':'var(--text2)'};cursor:pointer;font-family:inherit">${MNS[+m.split('-')[1]-1]}/${m.split('-')[0]}</button>`).join('')}</div>`
    :`<div style="color:var(--text3);font-size:13px;margin-bottom:1rem">Configure as datas na aba Business Case primeiro.</div>`;
  pane.innerHTML=`<div class="card"><div class="ct"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--orange)" stroke-width="2"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>Lançamento de Valores Realizados</div>
    <div style="margin-bottom:.5rem"><label class="fl">Selecione o Mês</label>${mSel}</div>
  </div><div id="real-body"></div>`;
  if(months.length&&realizadoMes)rRealizadoMes(realizadoMes,nmN,nmA);
}
function rRealizadoMes(mes,nmN,nmA){
  const el=$('real-body');if(!el)return;
  if(!S.realizado)S.realizado={};
  const rk=(m,id)=>m+'::'+id;
  const buildRows=(items,getplan,isWed)=>items.map(item=>{
    const k=rk(mes,item.id),r=S.realizado[k]||{v:'',q:'',pn:50,pa:50};
    const plan=getplan(item),real=r.v!==''?+r.v:null,dev=real!==null?real-plan:null;
    const splitCell=r.q==='ambos'
      ?`<div style="display:flex;align-items:center;gap:4px;margin-top:4px">
          <input id="rpn-${mes}-${item.id}" class="tc" type="number" value="${r.pn??50}" min="0" max="100" style="width:44px;text-align:center" oninput="upRealPct('${mes}','${item.id}','pn',this.value)">
          <span style="color:var(--text3);font-size:11px">/</span>
          <input id="rpa-${mes}-${item.id}" class="tc" type="number" value="${r.pa??50}" min="0" max="100" style="width:44px;text-align:center" oninput="upRealPct('${mes}','${item.id}','pa',this.value)">
        </div>`
      :'';
    return`<tr>
      <td style="color:var(--text)">${esc(item.desc||'(sem nome)')}</td>
      <td style="text-align:right;color:var(--text2)">${plan?fmt(plan):'—'}</td>
      <td style="text-align:right"><input class="tc" type="number" value="${r.v!==''?r.v:''}" placeholder="0" style="width:110px;text-align:right" oninput="upReal('${mes}','${item.id}','v',this.value)"></td>
      <td>
        <select class="tc" style="min-width:100px" onchange="upReal('${mes}','${item.id}','q',this.value)">
          <option value=""${!r.q?' selected':''}>—</option>
          <option value="noivo"${r.q==='noivo'?' selected':''}>${nmN}</option>
          <option value="noiva"${r.q==='noiva'?' selected':''}>${nmA}</option>
          <option value="ambos"${r.q==='ambos'?' selected':''}>Ambos</option>
        </select>
        ${splitCell}
      </td>
      <td id="dev-${mes}-${item.id}">${dev!==null?`<span class="${dev>0?'dev-neg':'dev-pos'}">${fmtS(dev)}</span>`:'<span style="color:var(--text3)">—</span>'}</td>
    </tr>`;
  }).join('');
  const subTot=(items,getplan,label)=>{
    let totP=0,totR=0,hasR=false;
    items.forEach(item=>{const k=rk(mes,item.id),r=S.realizado[k]||{};totP+=getplan(item);if(r.v!==''){totR+=+r.v||0;hasR=true;}});
    const dev=hasR?totR-totP:null;
    return`<tr class="real-sub"><td>${label}</td><td style="text-align:right">${fmt(totP)}</td><td style="text-align:right">${hasR?fmt(totR):'—'}</td><td></td><td>${dev!==null?`<span class="${dev>0?'dev-neg':'dev-pos'}">${fmtS(dev)}</span>`:'—'}</td></tr>`;
  };
  const wedItems=S.casamento.filter(g=>g.resp!=='presente');
  const thead=`<thead><tr><th>Descrição</th><th style="text-align:right">Planejado</th><th style="text-align:right">Realizado (total)</th><th>Quem pagou / % divisão</th><th style="text-align:right">Desvio</th></tr></thead>`;
  el.innerHTML=`
    <div class="card"><div class="ct"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--orange)" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>Custos Pessoais — ${MNS[+mes.split('-')[1]-1]}/${mes.split('-')[0]}</div>
      <div class="tbl-wrap"><table class="real-tbl" style="width:100%">${thead}<tbody>${S.custos.length?buildRows(S.custos,c=>planValCus(c,mes))+subTot(S.custos,c=>planValCus(c,mes),'Total Custos'):'<tr><td colspan="5" style="color:var(--text3)">Nenhum custo cadastrado</td></tr>'}</tbody></table></div></div>
    <div class="card"><div class="ct"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--orange)" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>Gastos do Casamento — ${MNS[+mes.split('-')[1]-1]}/${mes.split('-')[0]}</div>
      <div class="tbl-wrap"><table class="real-tbl" style="width:100%">${thead}<tbody>${wedItems.length?buildRows(wedItems,g=>planValWed(g,mes),true)+subTot(wedItems,g=>planValWed(g,mes),'Total Casamento'):'<tr><td colspan="5" style="color:var(--text3)">Nenhum gasto cadastrado</td></tr>'}</tbody></table></div></div>
    <p class="note">Quando pago por Ambos, informe o % de cada um para o desvio ser calculado corretamente no BC.</p>`;
}
window.upReal=function(mes,id,field,val){
  if(!S.realizado)S.realizado={};
  const k=mes+'::'+id;
  if(!S.realizado[k])S.realizado[k]={v:'',q:'',pn:50,pa:50};
  if(field==='v')S.realizado[k].v=val===''?'':+val||0;
  else S.realizado[k][field]=val;
  if(field==='v'){
    const devEl=$('dev-'+mes+'-'+id);
    if(devEl){
      const r=S.realizado[k],allItems=[...S.custos,...S.casamento.filter(g=>g.resp!=='presente')];
      const item=allItems.find(x=>x.id===id);
      if(item){const plan=S.custos.find(x=>x.id===id)?planValCus(item,mes):planValWed(item,mes),real=r.v!==''?+r.v:null,dev=real!==null?real-plan:null;devEl.innerHTML=dev!==null?`<span class="${dev>0?'dev-neg':'dev-pos'}">${fmtS(dev)}</span>`:'<span style="color:var(--text3)">—</span>';}
    }
  }
  if(field==='q'&&curTab==='realizado'){const nmN=S.pessoas.noivo.nome||'Noivo',nmA=S.pessoas.noiva.nome||'Noiva';rRealizadoMes(mes,nmN,nmA);}
  qs();if(curTab==='bc')rBCTable();
};
window.upRealPct=function(mes,id,f,v){
  if(!S.realizado)S.realizado={};
  const k=mes+'::'+id;
  if(!S.realizado[k])S.realizado[k]={v:'',q:'',pn:50,pa:50};
  S.realizado[k][f]=+v||0;
  if(f==='pn'){S.realizado[k].pa=100-(+v||0);const e=$(`rpa-${mes}-${id}`);if(e)e.value=S.realizado[k].pa;}
  else{S.realizado[k].pn=100-(+v||0);const e=$(`rpn-${mes}-${id}`);if(e)e.value=S.realizado[k].pn;}
  qs();if(curTab==='bc')rBCTable();
};

/* ── BUSINESS CASE ── */
function rBC(){
  const pane=$('pane-bc');if(!pane)return;
  pane.innerHTML=`<div id="bc-params"></div><div id="bc-table"></div>`;
  const svgCfg=`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--orange)" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93l-1.41 1.41M4.93 4.93l1.41 1.41M19.07 19.07l-1.41-1.41M4.93 19.07l1.41-1.41M12 2v2M12 20v2M2 12h2M20 12h2"/></svg>`;
  $('bc-params').innerHTML=`<div class="card"><div class="ct">${svgCfg} Parâmetros da Projeção</div>
    <div class="g2">
      <div class="mb"><label class="fl">Data do Casamento</label>${mpCreate('bc-data',S.bc.data||'')}</div>
      <div class="mb"><label class="fl">Mês de Início da Projeção</label>${mpCreate('bc-inicio',S.bc.inicio||'')}</div>
    </div></div>`;
  rBCTable();
}

window.bcToggle=function(gid){
  const rows=document.querySelectorAll(`.bc-det[data-gid="${gid}"]`);
  const arrow=document.getElementById('arr-'+gid);
  const open=arrow&&arrow.classList.contains('open');
  rows.forEach(r=>r.style.display=open?'none':'table-row');
  if(arrow)arrow.classList.toggle('open',!open);
};

function rBCTable(){
  const el=$('bc-table');if(!el)return;
  const{data,inicio}=S.bc;
  if(!data||!inicio){el.innerHTML=`<div class="empty-state"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--border2)" stroke-width="1.5" style="margin:0 auto .75rem;display:block"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg><div style="font-size:14px;font-weight:600;margin-bottom:.4rem">Selecione as datas acima</div><div style="font-size:12px">Escolha a data do casamento e o mês de início para gerar a projeção</div></div>`;return;}
  const sD=mToD(inicio),wD=mToD(data);
  if(!sD||!wD||sD>wD){el.innerHTML=`<div style="text-align:center;padding:1.5rem;color:var(--red);font-size:13px">O mês de início deve ser anterior ao mês do casamento.</div>`;return;}
  const eD=addM(wD,2),months=[];let cur=new Date(sD);
  while(cur<=eD){months.push(dToM(cur));cur=addM(cur,1);}
  const wIdx=months.indexOf(data),nm=months.length;
  const nN=netP(S.pessoas.noivo),nA=netP(S.pessoas.noiva);
  const nmN=S.pessoas.noivo.nome||'Noivo',nmA=S.pessoas.noiva.nome||'Noiva';
  const wExp=(g,m)=>{if(!g.inicio)return 0;const d=mDiff(g.inicio,m);if(d<0||d>=(g.parc||1))return 0;return g.tipo==='fixo'?(g.vf||0):((g.vv||[])[d]||0);};
  const ws=i=>i===wIdx?'background:rgba(249,115,22,.07);':'';
  const S3=arr=>{const tot=sumArr(arr),ate=wIdx>=0?sumArr(arr.slice(0,wIdx+1)):tot,apos=wIdx>=0&&wIdx<nm-1?sumArr(arr.slice(wIdx+1)):0;return[tot,ate,apos];};
  const sumCols=(a,b)=>a.map((_,i)=>a[i]+b[i]);
  const fmtSum=v=>v?fmt(v):`<span style="color:var(--text3)">—</span>`;
  const getReal=(id,m)=>{const r=(S.realizado||{})[m+'::'+id];return(r&&r.v!=='')?(+r.v||0):null;};
  // person-aware realized: applies split for 'ambos' entries
  const getRealP=(id,m,pid)=>{
    const r=(S.realizado||{})[m+'::'+id];
    if(!r||r.v==='')return null;
    const v=+r.v||0;
    if(!r.q)return null;
    if(r.q===pid)return v;
    if(r.q==='ambos'){const rpn=r.pn!=null?+r.pn:50,rpa=r.pa!=null?+r.pa:50;return pid==='noivo'?v*rpn/100:v*rpa/100;}
    return 0;
  };
  const fv=v=>bcMode==='dev'?`<span class="${v>0?'dev-neg':'dev-pos'}">${fmtS(v)}</span>`:v?fmt(v):'<span style="color:var(--text3)">—</span>';
  const s3=(vals,fw='600',cor='')=>{const[t,a,ap]=S3(vals),st=cor?`;color:${cor}`:'';return`<td class="sum-sep" style="text-align:right;font-weight:${fw}${st}">${fmtSum(t)}</td><td style="text-align:right;font-weight:${fw}${st}">${fmtSum(a)}</td><td style="text-align:right;font-weight:${fw}${st}">${fmtSum(ap)}</td>`;};
  const secRow=lbl=>`<tr class="sec-row"><td class="sticky">${lbl}</td>${months.map((_,i)=>`<td style="${ws(i)}"></td>`).join('')}<td class="sum-sep"></td><td></td><td></td></tr>`;
  const cv=(v,i)=>`<td style="text-align:right;${ws(i)}">${v?fmt(v):'<span style="color:var(--text3)">—</span>'}</td>`;
  const dataRow=(lbl,vals)=>`<tr><td class="sticky" style="padding-left:1.75rem">${lbl}</td>${vals.map((v,i)=>cv(v,i)).join('')}${s3(vals)}</tr>`;
  const subRow=(lbl,vals,cor)=>{const[t,a,ap]=S3(vals),st=cor?`;color:${cor}`:'';return`<tr class="sub-row"><td class="sticky" style="font-weight:700${st}">${lbl}</td>${vals.map((v,i)=>`<td style="text-align:right;font-weight:700;${ws(i)}${st}">${fmt(v)}</td>`).join('')}<td class="sum-sep" style="text-align:right;font-weight:700${st}">${fmt(t)}</td><td style="text-align:right;font-weight:700${st}">${fmt(a)}</td><td style="text-align:right;font-weight:700${st}">${fmt(ap)}</td></tr>`;};
  // cvM: pid optional — if provided uses getRealP (per-person), else getReal (full)
  const cvM=(id,planVal,m,i,pid)=>{
    const r=pid?getRealP(id,m,pid):getReal(id,m);
    const v=bcMode==='plan'?planVal:bcMode==='real'?(r!==null?r:null):(r!==null?r-planVal:null);
    return`<td style="text-align:right;${ws(i)}">${v!==null?fv(v):'<span style="color:var(--text3)">—</span>'}</td>`;
  };
  const grpHdrM=(lbl,items,gp,gid,cor,pid)=>{
    const pv=months.map(m=>items.reduce((s,x)=>s+gp(x,m),0));
    const rv=months.map(m=>items.reduce((s,x)=>{const r=pid?getRealP(x.id,m,pid):getReal(x.id,m);return s+(r!==null?r:gp(x,m));},0));
    const vals=bcMode==='plan'?pv:bcMode==='real'?rv:months.map((_,i)=>rv[i]-pv[i]);
    const[t,a,ap]=S3(vals),st=bcMode!=='dev'?`;color:${cor}`:'';
    return`<tr class="bc-grp sub-row" onclick="bcToggle('${gid}')"><td class="sticky" style="font-weight:600${st}"><span class="bc-arrow" id="arr-${gid}">&#9654;</span>${lbl}</td>${vals.map((v,i)=>`<td style="text-align:right;font-weight:600;${ws(i)}${bcMode!=='dev'?st:''}">${fv(v)}</td>`).join('')}<td class="sum-sep" style="text-align:right;font-weight:700${bcMode!=='dev'?st:''}">${fv(t)}</td><td style="text-align:right;font-weight:700${bcMode!=='dev'?st:''}">${fv(a)}</td><td style="text-align:right;font-weight:700${bcMode!=='dev'?st:''}">${fv(ap)}</td></tr>`;
  };
  const grpDetM=(items,gp,gid,pid)=>items.map(item=>`<tr class="bc-det" data-gid="${gid}" style="display:none"><td class="sticky">${esc(item.desc||'(sem nome)')}</td>${months.map((m,i)=>cvM(item.id,gp(item,m),m,i,pid)).join('')}${s3(months.map(m=>{const r=pid?getRealP(item.id,m,pid):getReal(item.id,m),p=gp(item,m);return bcMode==='plan'?p:bcMode==='real'?(r!==null?r:p):(r!==null?r-p:0);}),'500')}</tr>`).join('');
  const subTotM=(lbl,items,gp,cor)=>{
    const pv=months.map(m=>items.reduce((s,x)=>s+gp(x,m),0));
    const rv=months.map(m=>items.reduce((s,x)=>{const r=getReal(x.id,m);return s+(r!==null?r:gp(x,m));},0));
    const vals=bcMode==='plan'?pv:bcMode==='real'?rv:months.map((_,i)=>rv[i]-pv[i]);
    const[t,a,ap]=S3(vals),st=bcMode!=='dev'&&cor?`;color:${cor}`:'';
    return`<tr class="sub-row"><td class="sticky" style="font-weight:700${st}">${lbl}</td>${vals.map((v,i)=>`<td style="text-align:right;font-weight:700;${ws(i)}${bcMode!=='dev'?st:''}">${fv(v)}</td>`).join('')}<td class="sum-sep" style="text-align:right;font-weight:700${bcMode!=='dev'?st:''}">${fv(t)}</td><td style="text-align:right;font-weight:700${bcMode!=='dev'?st:''}">${fv(a)}</td><td style="text-align:right;font-weight:700${bcMode!=='dev'?st:''}">${fv(ap)}</td></tr>`;
  };
  const mkCR=(lbl,vals,cor,cls='')=>{const[t,a,ap]=S3(vals);return`<tr${cls?` class="${cls}"`:''} ><td class="sticky" style="font-weight:700;color:${cor}">${lbl}</td>${vals.map((v,i)=>`<td style="text-align:right;font-weight:700;${ws(i)}color:${v>=0?cor:'var(--red)'}">${fmtS(v)}</td>`).join('')}<td class="sum-sep" style="text-align:right;font-weight:700;color:${t>=0?cor:'var(--red)'}">${fmtS(t)}</td><td style="text-align:right;font-weight:700;color:${a>=0?cor:'var(--red)'}">${fmtS(a)}</td><td style="text-align:right;font-weight:700;color:${ap>=0?cor:'var(--red)'}">${fmtS(ap)}</td></tr>`;};
  const mkAR=(lbl,vals,cor)=>{const[,a]=S3(vals);return`<tr><td class="sticky" style="color:${cor}">${lbl}</td>${vals.map((v,i)=>`<td style="text-align:right;${ws(i)}color:${v>=0?cor:'var(--red)'}">${fmt(v)}</td>`).join('')}<td class="sum-sep" style="text-align:right;font-size:10px;color:var(--text3)">pos. final</td><td style="text-align:right;font-weight:700;color:${wIdx>=0&&vals[wIdx]>=0?'var(--orange)':'var(--red)'}">${wIdx>=0?fmt(vals[wIdx]):'—'}</td><td style="text-align:right;font-weight:700;color:${vals[nm-1]>=0?cor:'var(--red)'}">${fmt(vals[nm-1])}</td></tr>`;};

  /* data */
  const recN=months.map(()=>nN.n),recA=months.map(()=>nA.n);
  const presItems=(S.presentes||[]).map(p=>({label:p.desc||'Presente',vals:months.map(m=>{if(!p.inicio)return 0;const d=mDiff(p.inicio,m);if(d<0||d>=(p.parc||1))return 0;return p.tipo==='fixo'?(p.vf||0):((p.vv||[])[d]||0);})})).filter(r=>sumArr(r.vals)>0);
  const totPres=months.map((_,i)=>presItems.reduce((s,r)=>s+r.vals[i],0));
  const totRec=months.map((_,i)=>recN[i]+recA[i]+totPres[i]);
  const gpCusN=(c,m)=>{const v=planValCus(c,m);return c.resp==='noivo'?v:v/2;};
  const gpCusA=(c,m)=>{const v=planValCus(c,m);return c.resp==='noiva'?v:v/2;};
  const cusRawN=S.custos.filter(c=>c.resp!=='noiva'),cusRawA=S.custos.filter(c=>c.resp!=='noivo');
  const totCusN=months.map((m)=>cusRawN.reduce((s,c)=>s+gpCusN(c,m),0));
  const totCusA=months.map((m)=>cusRawA.reduce((s,c)=>s+gpCusA(c,m),0));
  const totCusto=sumCols(totCusN,totCusA);
  const gpWN=(g,m)=>{const v=wExp(g,m);return g.resp==='noivo'?v:v*(g.pn!=null?+g.pn:50)/100;};
  const gpWA=(g,m)=>{const v=wExp(g,m);return g.resp==='noiva'?v:v*(g.pa!=null?+g.pa:50)/100;};
  const wRawN=S.casamento.filter(g=>g.resp!=='presente'&&g.resp!=='noiva');
  const wRawA=S.casamento.filter(g=>g.resp!=='presente'&&g.resp!=='noivo');
  const totWN=months.map((m,i)=>wRawN.reduce((s,g)=>s+gpWN(g,m),0));
  const totWA=months.map((m,i)=>wRawA.reduce((s,g)=>s+gpWA(g,m),0));
  const totWedd=sumCols(totWN,totWA);
  const totGN=sumCols(totCusN,totWN),totGA=sumCols(totCusA,totWA);
  const caixaN=months.map((_,i)=>recN[i]-totGN[i]);
  const caixaA=months.map((_,i)=>recA[i]-totGA[i]);
  const caixaV=months.map((_,i)=>caixaN[i]+caixaA[i]+totPres[i]);
  let aN=0,aA=0,aC=0;
  const accumN=caixaN.map(v=>{aN+=v;return aN;});
  const accumA=caixaA.map(v=>{aA+=v;return aA;});
  const accumV=caixaV.map(v=>{aC+=v;return aC;});
  const empty=`${months.map(()=>'<td></td>').join('')}<td class="sum-sep"></td><td></td><td></td>`;
  const mHdr=months.map((m,i)=>`<th style="text-align:right;min-width:105px;${i===wIdx?'background:rgba(249,115,22,.1);color:var(--orange)':''}">${MNS[+m.split('-')[1]-1]}/${m.split('-')[0]}${i===wIdx?' ◆':''}</th>`).join('');

  el.innerHTML=`<div class="card">
    <div class="ct"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--orange)" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>Projeção Mês a Mês</div>
    <div class="bc-mode-bar">
      <button class="bc-mode-btn${bcMode==='plan'?' on':''}" data-m="plan" onclick="setBCMode('plan')">Planejado</button>
      <button class="bc-mode-btn${bcMode==='real'?' on':''}" data-m="real" onclick="setBCMode('real')">Realizado</button>
      <button class="bc-mode-btn${bcMode==='dev'?' on':''}" data-m="dev" onclick="setBCMode('dev')">Desvio</button>
    </div>
    <div class="bc-wrap"><table class="bc-tbl">
      <thead><tr><th class="lh">Categoria</th>${mHdr}<th style="text-align:right;min-width:115px;color:var(--purple);border-left:2px solid var(--border2)">Total Período</th><th style="text-align:right;min-width:115px;color:var(--orange)">Até Casamento</th><th style="text-align:right;min-width:115px;color:var(--teal)">Após Casamento</th></tr></thead>
      <tbody>
        ${secRow('Receitas')}
        ${dataRow(nmN,recN)}${dataRow(nmA,recA)}
        ${presItems.length?presItems.map(r=>dataRow('Presente: '+r.label,r.vals)).join(''):''}
        ${subRow('Total Receita',totRec,'var(--teal)')}

        ${secRow('Custos Pessoais')}
        ${cusRawN.length?grpHdrM(nmN,cusRawN,gpCusN,'cus-n','var(--orange)')+grpDetM(cusRawN,gpCusN,'cus-n'):`<tr><td class="sticky" style="padding-left:1.75rem;color:var(--text3)">${nmN} — sem custos</td>${empty}</tr>`}
        ${cusRawA.length?grpHdrM(nmA,cusRawA,gpCusA,'cus-a','var(--purple)')+grpDetM(cusRawA,gpCusA,'cus-a'):`<tr><td class="sticky" style="padding-left:1.75rem;color:var(--text3)">${nmA} — sem custos</td>${empty}</tr>`}
        ${subTotM('Total Custos Pessoais',S.custos,(c,m)=>planValCus(c,m),'var(--red)')}

        ${secRow('Gastos do Casamento')}
        ${wRawN.length?grpHdrM(nmN,wRawN,gpWN,'wed-n','var(--orange)','noivo')+grpDetM(wRawN,gpWN,'wed-n','noivo'):`<tr><td class="sticky" style="padding-left:1.75rem;color:var(--text3)">${nmN} — sem gastos</td>${empty}</tr>`}
        ${wRawA.length?grpHdrM(nmA,wRawA,gpWA,'wed-a','var(--purple)','noiva')+grpDetM(wRawA,gpWA,'wed-a','noiva'):`<tr><td class="sticky" style="padding-left:1.75rem;color:var(--text3)">${nmA} — sem gastos</td>${empty}</tr>`}
        ${subTotM('Total Gastos Casamento',S.casamento.filter(g=>g.resp!=='presente'),(g,m)=>planValWed(g,m),'var(--warn)')}

        ${secRow('Total Gastos (Custos + Casamento)')}
        ${subRow(nmN,totGN,'var(--orange)')}${subRow(nmA,totGA,'var(--purple)')}${subRow('Total Casal',sumCols(totGN,totGA),'var(--red)')}

        ${secRow('Caixa Livre')}
        ${mkCR(nmN,caixaN,'var(--orange)')}${mkCR(nmA,caixaA,'var(--purple)')}${mkCR('Total Casal',caixaV,'var(--teal)','caixa-row')}

        ${secRow('Saldo Acumulado')}
        ${mkAR(nmN,accumN,'var(--orange)')}${mkAR(nmA,accumA,'var(--purple)')}${mkAR('Total Casal',accumV,'var(--teal)')}
      </tbody>
    </table></div>
    <p class="note">▶ Clique no nome para expandir · ◆ Mês do casamento · Desvio: verde = abaixo do orçamento, vermelho = acima</p>
  </div>`;
}
</script>
</body>
</html>
